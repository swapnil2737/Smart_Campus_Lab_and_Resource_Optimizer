<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Campus Lab & Resource Optimizer</title>
    <meta name="description" content="Smart Campus Lab & Resource Optimizer by Team D - Web Engine">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <main class="login-container">
        <!-- Left Side -->
        <section class="login-left">
            <div class="login-brand">
                <h1>Smart Campus Lab & Resource Optimizer</h1>
                <p class="tagline">Smart Scheduling. Efficient Resources. Better Campus.</p>
                <p class="team-subtitle">Team D – Web Engine</p>
            </div>
            
            <div class="illustration-container">
                <!-- CSS Illustration representing Lab/Resources -->
                <div class="css-illustration">
                    <div class="calendar-icon">
                        <div class="cal-header"></div>
                        <div class="cal-grid">
                            <span></span><span></span><span></span><span></span>
                        </div>
                    </div>
                    <div class="flask-icon">
                        <div class="flask-neck"></div>
                        <div class="flask-body">
                            <div class="liquid"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Right Side -->
        <section class="login-right">
            <div class="login-card">
                <h2>Welcome Back</h2>
                <p class="subtitle">Login to continue to your portal</p>
                
                <div id="login-error" class="alert alert-error" style="display: none;">
                    Invalid username or password.
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="role">Select Your Role</label>
                        <select id="role" required>
                            <option value="" disabled selected>Select Role</option>
                            <option value="Student">Student</option>
                            <option value="Faculty">Faculty</option>
                            <option value="Lab Assistant">Lab Assistant</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="username">Username / Email</label>
                        <input type="text" id="username" placeholder="Enter your username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" placeholder="Enter your password" required>
                            <button type="button" id="toggle-password" class="btn-icon">Show</button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember-me">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-primary login-btn">Login</button>
                </form>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
